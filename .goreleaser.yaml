# GoReleaser v2. Runs from .github/workflows/release.yml when a tag v* is pushed.
# Local check without publishing: goreleaser release --snapshot --clean
version: 2

project_name: handle-mcp

builds:
  - id: handle-mcp
    main: ./cmd/handle-mcp
    binary: handle-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: handle-mcp
    ids:
      - handle-mcp
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: McAndersDK
    name: handle-mcp-go
