name: ci
# Only on release PRs, or by hand. Normal work is tested locally before each push.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Ubuntu only: Git on Windows may check files out with CRLF, which gofmt would flag falsely.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted. Run 'gofmt -w cmd internal':"
            echo "$unformatted"
            exit 1
          fi
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
